name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Codebase & Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Price Leak Guard (Non-Negotiable Quantities Only)
        run: node scripts/guard-price-leak.js

      - name: 2. TypeScript Strict Typecheck
        run: npm run typecheck

      - name: 3. ESLint Quality Check
        run: npm run lint

      - name: 4. Vitest Unit & Contract Tests
        run: npm test

      - name: 5. Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build
          CRON_SECRET: dummy-cron-secret
