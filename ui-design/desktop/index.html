<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Pizza 4P's Inventory Control Tool — Desktop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Serif+Display:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#242E52; --blue:#02499D; --cream:#F4F2EF; --sand:#EAE6DC; --rule:#DDD6C5; --paper:#FFFFFF;
  --terra:#A9581A; --forest:#28473D; --err:#B32E16; --amber:#7A4B00; --amber-bg:#FBEFD0;
  --ink-2:#4B5470; --ink-3:#5F6785; --ph:#756F62;
  --ok-bg:#E3EDE7; --err-bg:#F8E3DE; --info-bg:#E2E9F5;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --disp:"Archivo Narrow","Be Vietnam Pro",Arial Narrow,sans-serif;
  --body:"Be Vietnam Pro",system-ui,Segoe UI,sans-serif;
  --serif:"Noto Serif Display",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:#DFDACE;font-family:var(--body);color:var(--navy);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.frame{width:1440px;margin:0 auto;background:var(--cream);min-height:100vh;position:relative;display:flex;flex-direction:column}
.demo{background:#332F23;color:#E9E4D6;font-family:var(--mono);font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:14px;padding:6px 72px}
.demo select{background:#4A4533;color:#fff;border:1px solid #6A6350;border-radius:3px;font:inherit;padding:2px 6px}
.demo .sp{flex:1}
/* ticket paper */
.tk{background:var(--paper);position:relative}
.perf{height:9px;background:var(--paper);-webkit-mask-image:radial-gradient(circle at 6px 0px,transparent 0 5px,#000 5.4px);mask-image:radial-gradient(circle at 6px 0px,transparent 0 5px,#000 5.4px);-webkit-mask-size:12px 9px;mask-size:12px 9px;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x}
.perf-b{transform:rotate(180deg)}
.tk-head{display:flex;align-items:baseline;gap:10px;padding:12px 24px 10px;border-bottom:1px dashed var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tk-head .no{color:var(--navy);font-weight:600}
.tk-head .fill{flex:1;border-bottom:1px dotted #BDB5A5;transform:translateY(-3px)}
.tk-body{padding:18px 24px}
/* rail */
.rail{display:flex;align-items:center;gap:18px;padding:20px 72px 16px;border-bottom:1px solid var(--rule)}
.logo{width:150px;color:var(--navy);display:block;flex:none}
.rail .div{width:1px;height:26px;background:var(--rule);flex:none}
.tag-line{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);line-height:1.35;width:96px}
.rail .sp{flex:1}
.rail nav{display:flex;gap:16px;font-family:var(--disp);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--ink-2);white-space:nowrap}
.rail nav a{text-decoration:none;color:inherit;padding-bottom:2px;border-bottom:2px solid transparent}
.rail nav a.on{color:var(--navy);border-bottom-color:var(--terra)}
.rail nav a:hover{color:var(--navy)}
.sw{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.sw span{letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--ink-3)}
.sw select{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:3px 6px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy)}
.who{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;line-height:1.4;max-width:170px}
.who b{color:var(--navy);font-weight:600;font-size:13px}
/* type */
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-weight:500}
.h1{font-family:var(--disp);font-weight:600;font-size:46px;line-height:1.04;letter-spacing:-.005em;text-transform:uppercase;margin:6px 0 0}
.h1 em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;font-size:40px}
.h3{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:14px;max-width:760px;margin:8px 0 0}
.gloss{color:var(--ink-3);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* layout */
main{flex:1;padding:28px 72px 56px}
.head{display:flex;align-items:flex-end;gap:32px;margin-bottom:22px}
.head>div:first-child{flex:1}
.cols{display:grid;gap:28px;align-items:start}.cols>*{min-width:0}
.c-ov{grid-template-columns:1fr 330px}
.c-rq{grid-template-columns:280px 1fr 310px}
.c-is{grid-template-columns:360px 1fr}
.c-bal{grid-template-columns:1fr 330px}
.c-imp{grid-template-columns:1fr 340px}
.c-ap{grid-template-columns:380px 1fr 300px}
.c-us{grid-template-columns:1fr 360px}
.stack>*+*{margin-top:16px}
.stub{background:var(--sand);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.stub.w{background:var(--paper)}
.stub .lbl{display:block;margin-bottom:8px}
/* buttons / chips */
.btn{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;background:var(--terra);color:#fff;border:1px solid var(--terra);border-radius:4px;padding:11px 22px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#94490F}
.btn.ghost{background:transparent;color:var(--navy);border-color:#B9B09B}
.btn.ghost:hover{background:var(--sand)}
.btn.sm{font-size:13px;padding:6px 12px;letter-spacing:.1em}
.btn:disabled{background:#D6D0C2;border-color:#D6D0C2;color:#5B5547;cursor:not-allowed}
.btn.ghost:disabled{background:transparent;border-color:var(--rule);color:#6B6556}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,.row:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.06em;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;color:var(--ink-2);background:var(--cream);cursor:pointer}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.8;margin-left:4px}
.b{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;padding:1px 7px;border:1px solid transparent;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--forest);border-color:#B8CFC2}
.b.am{background:var(--amber-bg);color:var(--amber);border-color:#E4C987}
.b.er{background:var(--err);color:#fff}
.b.re{background:var(--info-bg);color:#0A3B80;border-color:#B5C7E6}
.b.mu{background:var(--sand);color:var(--ink-2);border-color:var(--rule)}
.b.ur{background:transparent;color:var(--err);border:1.5px solid var(--err);border-radius:4px;transform:rotate(-1.5deg)}
.stamp{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);border:1.5px solid var(--terra);border-radius:4px;padding:3px 9px;transform:rotate(-1.5deg)}
/* tables */
table{border-collapse:collapse;width:100%}
th{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--rule);font-weight:500;white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px 9px 0;border-bottom:1px dotted var(--rule);vertical-align:middle;font-size:14px}
td.m{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:#FBFAF6}
tr.sel td{background:#F3EEE2}
tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--terra)}
tr.dim td{color:var(--ink-3)}
table.dense td,table.dense th{padding-right:8px;font-size:13px}table.dense td.m{font-size:12px}
table.tick td{padding:5px 0;font-family:var(--mono);font-size:13px;vertical-align:top}
table.tick td:first-child{color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-size:12px;width:112px}
table.tick td:last-child{text-align:right;color:var(--navy);font-weight:500}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 16px 14px;text-align:left;cursor:pointer;display:block}
.tile:hover{border-color:var(--ink-3)}
.tile.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.tile .big{font-family:var(--disp);font-weight:600;font-size:42px;line-height:1.05;display:block;margin-top:2px}
.tile .s{font-size:13px;color:var(--ink-2);display:block}
.win{display:flex;align-items:center;gap:14px;border:1px dashed #B9B09B;border-radius:4px;padding:8px 14px;margin-bottom:16px;background:var(--paper);flex-wrap:wrap}
/* forms */
.fld{margin-bottom:14px}
.in,select.in,textarea.in{display:block;width:100%;border:1px solid #BDB5A5;border-radius:4px;background:var(--paper);padding:8px 10px;font-size:14px;color:var(--navy);margin-top:5px}
.in::placeholder{color:var(--ph)}
.in.err{border-color:var(--err)}
.step{display:inline-flex;align-items:center;border:1px solid #BDB5A5;border-radius:4px;background:var(--paper)}
.step button{width:30px;height:30px;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--navy)}
.step button:hover{background:var(--sand)}
.step button:disabled{color:#9a9486;cursor:not-allowed}
.step b{min-width:56px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid #BDB5A5;border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid #BDB5A5;background:var(--paper);padding:6px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.note{border:1px solid var(--rule);background:var(--sand);border-radius:4px;padding:10px 14px;font-size:14px}
.note.am{background:var(--amber-bg);border-color:#E4C987;color:#4D2F00}
.note.er{background:var(--err-bg);border-color:#E8B8AD;color:#6D1A0A}
.note.ok{background:var(--ok-bg);border-color:#B8CFC2;color:var(--forest)}
.note b{font-weight:600}
.dash{border-top:1px dashed var(--rule);margin:14px 0}
.ledrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-family:var(--mono);font-size:13px;padding:7px 0;border-bottom:1px dotted var(--rule);align-items:baseline}
.ledrow .t{font-size:12px;font-weight:600;letter-spacing:.04em}
.neg{color:var(--err)} .pos{color:var(--forest)}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:6px 0 16px}
.tl>div{position:relative;padding:0 10px 0 0}
.tl .dot{width:14px;height:14px;border-radius:50%;border:2px solid #9A9382;background:var(--paper);margin-bottom:8px;position:relative}
.tl .done .dot{background:var(--forest);border-color:var(--forest)}
.tl .cur .dot{background:var(--paper);border-color:var(--terra);box-shadow:0 0 0 3px #F0DCCB}
.tl>div:not(:last-child):before{content:"";position:absolute;left:18px;right:6px;top:6px;border-top:1px dashed #9A9382}
.tl .done:not(:last-child):before{border-top:2px solid var(--forest)}
.tl .tt{font-family:var(--disp);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.tl .ts{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.drop{border:1.5px dashed var(--terra);border-radius:4px;background:#FBF6F1;padding:26px 24px;text-align:center}
.drop .big{font-family:var(--disp);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:4px 0}
.list>.item{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;cursor:pointer;margin-bottom:8px}
.list>.item:hover{border-color:var(--ink-3)}
.list>.item.sel{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.list .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .id{font-family:var(--mono);font-weight:600;font-size:13px}
.lot{display:grid;grid-template-columns:18px 104px 88px 86px 74px 1fr;gap:6px;white-space:nowrap;align-items:center;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;margin-top:6px;background:var(--paper);font-family:var(--mono);font-size:13px;width:100%;text-align:left;cursor:pointer}
.lot.sel{border-color:var(--navy);background:#F6F3EA}
.lot.lock{background:var(--err-bg);border-color:#E8B8AD;cursor:not-allowed}
.rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-block}
.lot.sel .rd{background:radial-gradient(var(--terra) 0 4px,#fff 4.5px);border-color:var(--terra)}
.lot.lock .rd{border-color:#B9806F;background:repeating-linear-gradient(45deg,#E8B8AD 0 2px,#fff 2px 4px)}
.line{padding:14px 0;border-bottom:1px dashed var(--rule)}
.line:last-child{border-bottom:0}
.line .ln{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.line .nm{font-family:var(--disp);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.toast{position:fixed;right:24px;bottom:22px;pointer-events:none;background:#242E52;color:#fff;font-family:var(--mono);font-size:13px;padding:10px 18px;border-radius:4px;z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:380px}
.foot{padding:20px 72px 26px;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:center}
.foot .sp{flex:1}
.mat td,.mat th{text-align:center;padding:7px 6px}
.mat td:first-child,.mat th:first-child{text-align:left}
.ro{color:var(--ink-2);font-style:italic}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>

  <div class="demo"><b>PROTOTYPE</b><span>Sample data. Windows and thresholds are [Owner to set].</span><span class="sp"></span><label for="viewas">View as</label>
    <select id="viewas" data-i="role"></select></div>

</div>

    ${sel.lots.map(l=>`<div class="ledrow"><span class="t">${l.id}</span><span>exp ${l.exp}</span><span>${fq(sel,l.qty)} ${l.st==='lk'?badge('LOCK','er'):l.st==='am'?badge('Amber','am'):''}</span></div>`).join('')}
    <p class="gloss" style="margin:8px 0 0">Lots ordered oldest first (FIFO). Locked lots cannot be issued.</p></div>
   <div class="stub w"><span class="lbl">Reorder suggestion (sample rule)</span>
    <div class="meta" style="color:var(--navy)">suggested = max(0, par − book − open PO)</div>
    <table class="tick" style="margin-top:6px"><tr><td>Par</td><td>${fq(sel,sel.par)}</td></tr><tr><td>Book</td><td>${fq(sel,sel.book)}</td></tr><tr><td>Open PO</td><td>${fq(sel,sel.po)}</td></tr><tr><td>Reorder pt</td><td>${fq(sel,sel.rp)}</td></tr></table>
    <div class="dash"></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Suggest</span><b class="num" style="font-size:20px">${fq(sel,sug)}</b></div>
    <p class="gloss" style="margin:6px 0 0">${sel.book<=sel.rp?'Book is at or below the reorder point.':'Above reorder point, no action needed.'} Par and reorder point are [Owner to set]; values shown are sample.</p></div>
  </aside></div>`;
}

/* ============ 2 PICK QUEUE ============ */
function pickState(r){
  if(S.pick[r.id])return S.pick[r.id];
  const p=r.lines.map(([c,q])=>{const it=IT(c);const lot=it.lots.find(l=>l.st!=='lk'&&l.qty>0);return {lot:lot?lot.id:null,q:lot?Math.min(q,lot.qty):0}});
  return S.pick[r.id]=p;
}
function vRequests(){
  const list=S.reqs.filter(r=>S.rqF==='all'||(S.rqF==='urgent'?r.urgent:r.sec===S.rqF));
  const r=S.reqs.find(x=>x.id===S.rqSel)||pend()[0];
  const stLbl={queued:['Queued','mu'],picking:['Picking · locked','am'],awaiting:['Awaiting runner','re'],done:['Confirmed','ok'],cancelled:['Cancelled','mu']};
  const left=`<aside><div class="chips" style="margin-bottom:12px">${[['all','All'],['Kitchen','Kitchen'],['Bar','Bar'],['Cheese','Cheese'],['urgent','Urgent']].map(([v,l])=>`<button class="chip ${S.rqF===v?'on':''}" data-a="rqf" data-v="${v}">${l}</button>`).join('')}</div>
   <div class="list">${list.map(q=>`<button class="item ${q.id===r.id?'sel':''}" data-a="rqsel" data-v="${q.id}"><div class="top"><span class="id">${q.id}</span>${q.urgent?badge('URGENT','ur'):badge('Standard','mu')}<span style="margin-left:auto">${badge(...stLbl[q.st])}</span></div>
    <div style="margin-top:6px"><b>${q.sec}</b> · ${q.lines.length} line${q.lines.length>1?'s':''} · needed ${q.needed}</div>${q.urgent?`<div class="gloss" style="margin-top:2px">Reason: ${esc(q.reason)}</div>`:''}<div class="meta" style="margin-top:2px">submitted ${q.time}</div></button>`).join('')||'<div class="note">No requests match this filter.</div>'}</div></aside>`;
  if(!r)return head('Pick queue','Nothing <em>waiting.</em>','')+left;
  const can=r.st==='queued'||r.st==='picking';
  const ps=pickState(r);
  const lock=r.st==='queued'?`<div class="note"><b>Requester edit lock.</b> ${r.sec} requester can still edit quantities or cancel while this is Queued. <button class="btn ghost sm" data-a="begin" style="margin-left:8px">Begin picking</button> locks it for the requester.</div>`
   :r.st==='picking'?`<div class="note am"><b>Locked for requester since ${r.lockT||S.clock}.</b> Edit and cancel are disabled on the requester's side. Quantity changes now go through you.</div>`
   :`<div class="note">${r.st==='awaiting'?'Staged. Waiting for the runner to confirm at the door (phone).':'Closed.'}</div>`;
  const lines=r.lines.map(([c,q],i)=>{const it=IT(c),p=ps[i];const part=p.q>0&&p.q<q;
    return `<div class="line"><div class="ln"><span class="nm">${it.n}</span><span class="meta">${c}</span><span class="b mu">Requested ${fq(it,q)}</span>${p.q<=0?badge('Not staged','mu'):part?badge('Partial','am'):badge('Full','ok')}<span style="margin-left:auto" class="step"><button data-a="pq" data-i="${i}" data-d="-1" ${!can||p.q<=0?'disabled':''} aria-label="Less">−</button><b>${it.u==='kg'?p.q.toFixed(1):p.q} ${it.u}</b><button data-a="pq" data-i="${i}" data-d="1" ${!can||p.q>=q||(it.lots.find(l=>l.id===p.lot)||{qty:0}).qty<=p.q?'disabled':''} aria-label="More">+</button></span></div>
     ${it.lots.map(l=>{const lk=l.st==='lk',s=l.id===p.lot;return `<button class="lot ${s?'sel':''} ${lk?'lock':''}" data-a="lot" data-i="${i}" data-v="${l.id}" ${lk||!can?'disabled':''} aria-pressed="${s}"><span class="rd"></span><span><b>${l.id}</b></span><span>recv ${l.recv}</span><span>exp ${l.exp}</span><span style="text-align:right">${fq(it,l.qty)}</span><span>${lk?badge('EXPIRED LOCK','er'):l.st==='am'?badge('Expiry amber','am'):badge('FIFO ok','ok')}</span></button>`}).join('')}</div>`}).join('');
  const rows=r.lines.map(([c],i)=>({c,p:ps[i]})).filter(x=>x.p.q>0);
  const any=can&&rows.length>0&&!frozen();
  const ticket=tkS(r.id+' · '+r.sec.toUpperCase()+' · '+(r.urgent?'URGENT':'STANDARD'),'needed by '+r.needed,`
    ${r.urgent?`<div class="note er" style="margin-bottom:12px"><b>URGENT.</b> Submitted outside the issue window. Reason: ${esc(r.reason)}.</div>`:''}${lock}<div style="margin-top:6px">${lines}</div>
    <div class="dash"></div><div style="display:flex;align-items:center;gap:16px"><span class="meta" style="flex:1">FIFO: oldest eligible lot is pre-selected. Staging drops book stock at once (ISSUE_PENDING). The runner confirms at the door.</span><button class="btn" data-a="stage" ${any?'':'disabled'}>Stage &amp; hand to runner</button></div>`);
  const right=`<aside class="stack"><div class="stub w"><span class="lbl">Ledger rows this will append</span>
    ${rows.length&&can?rows.map(x=>{const it=IT(x.c);return `<div class="ledrow"><span class="t">ISSUE_PENDING</span><span>${it.n}</span><span class="neg">${sg(it,-x.p.q)}</span></div>`}).join(''):'<p class="gloss" style="margin:0">Nothing to append yet.</p>'}
    <p class="gloss" style="margin:8px 0 0">Append-only. Each row carries who, when and the reference ${r.id}.</p></div>
   <div class="stub"><span class="lbl">Live derived stock</span><table class="tick">
    ${r.lines.map(([c],i)=>{const it=IT(c),p=ps[i];const a=can?it.book-p.q:it.book;return `<tr><td style="width:auto">${it.n}</td><td>${fq(it,it.book)} → <b>${fq(it,Math.round(a*100)/100)}</b></td></tr>`}).join('')}</table>
    <p class="gloss" style="margin:8px 0 0">Book now → after staging.</p></div></aside>`;
  return freezeBar()+head('Requests and pick queue','Pick <em>ticket.</em>','Select a request, confirm the FIFO lot, stage full or partial. Stock is never edited, only appended.')+`<div class="cols c-rq">${left}<div>${ticket}</div>${right}</div>`;
}

/* ============ 3 NEW REQUEST ============ */
function vRequest(){
  const nr=S.nr,out=nr.at==='out';
  const matches=nr.q.trim()?ITEMS.filter(i=>(i.n+i.c).toLowerCase().includes(nr.q.toLowerCase())&&!nr.lines.find(l=>l.c===i.c)).slice(0,5):[];
  const ok=nr.lines.length>0&&nr.lines.every(l=>l.q>0)&&(!out||nr.reason.trim().length>2);
  const mine=[...S.reqs.filter(reqMine)].reverse();
  const stLbl={queued:['Queued','mu'],picking:['Picking · locked','am'],awaiting:['Awaiting runner · locked','re'],done:['Confirmed','ok'],cancelled:['Cancelled','mu']};
  const prim=`<button class="btn" data-a="submit" ${ok?'':'disabled'}>${nr.editing?'Save changes':'Submit request'}</button>`;
  return head('Section Requester · Kitchen · IND-DEL-01','New <em>request.</em>','Quantities only. You will never see price or cost. You may change or cancel until the keeper starts picking.',prim)+
  `<div class="cols c-bal"><div class="stack">
  ${tkS(nr.editing?'EDITING '+nr.editing:'DRAFT REQUEST · KITCHEN','submitting at '+(out?'12:40':'10:15')+' (sample clock)',`
   <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end">
    <div><span class="lbl">Sample clock</span><br><div class="seg" style="margin-top:5px"><button class="${!out?'on':''}" data-a="at" data-v="in">10:15 inside window</button><button class="${out?'on':''}" data-a="at" data-v="out">12:40 outside window</button></div></div>
    <div><label class="lbl" for="needed">Needed by</label><select id="needed" class="in" style="width:120px" data-i="needed">${['10:45','11:00','11:30','15:00','16:30'].map(t=>`<option ${t===nr.needed?'selected':''}>${t}</option>`).join('')}</select></div></div>
   ${out?`<div class="note er" style="margin-bottom:12px"><b>Outside the issue window (sample 06:00–11:30, 14:00–17:00).</b> Your request is still accepted but is flagged ${badge('URGENT','ur')}. A reason is required.<label class="lbl" for="reason" style="display:block;margin-top:8px">Reason for urgent request</label><input id="reason" class="in ${nr.reason.trim()?'':'err'}" data-i="reason" value="${esc(nr.reason)}" placeholder="e.g. Banquet booking added after cut-off"></div>`
     :`<div class="note ok" style="margin-bottom:12px"><b>Inside the issue window.</b> Standard request, picked in order.</div>`}
   <label class="lbl" for="isearch">Add item</label><input id="isearch" class="in" data-i="isearch" value="${esc(nr.q)}" placeholder="Search item name or code, e.g. mozz" autocomplete="off">
   ${matches.length?`<div class="stub w" style="margin-top:6px;padding:6px 12px">${matches.map(i=>`<button class="chip" style="margin:4px 6px 4px 0" data-a="add" data-v="${i.c}">${i.n} <span class="n">${i.u}</span></button>`).join('')}</div>`:nr.q.trim()?'<p class="gloss">No matching item.</p>':''}
   <div class="dash"></div><span class="lbl">Lines (${nr.lines.length})</span>
   ${nr.lines.length?nr.lines.map((l,i)=>{const it=IT(l.c);return `<div class="line"><div class="ln"><span class="nm">${it.n}</span><span class="meta">${it.c} · ${it.wh==='COLD'?'Cold Room':'Dry Store'}</span><span style="margin-left:auto" class="step"><button data-a="nq" data-i="${i}" data-d="-1" aria-label="Less">−</button><b>${it.u==='kg'?l.q.toFixed(1):l.q}</b><button data-a="nq" data-i="${i}" data-d="1" aria-label="More">+</button></span><span class="meta" style="width:30px">${it.u}</span><button class="btn ghost sm" data-a="rmline" data-i="${i}">Remove</button></div></div>`}).join(''):'<div class="note" style="margin-top:8px">No lines yet. Search an item above.</div>'}
   `)}
  </div>
  <aside><div class="stub w"><span class="lbl">My requests (Kitchen)</span>
   ${mine.map(q=>{const ed=q.st==='queued';return `<div style="padding:10px 0;border-bottom:1px dotted var(--rule)"><div class="top" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b class="meta" style="color:var(--navy)">${q.id}</b>${q.urgent?badge('URGENT','ur'):''}<span style="margin-left:auto">${badge(...stLbl[q.st])}</span></div>
    <div style="margin:4px 0">${q.lines.map(([c,n])=>IT(c).n+' '+fq(IT(c),n)).join(', ')}</div><div class="meta">needed ${q.needed}</div>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:center">${ed?`<button class="btn ghost sm" data-a="edit" data-v="${q.id}">Edit</button><button class="btn ghost sm" data-a="cancel" data-v="${q.id}">Cancel request</button>`:`<span class="gloss">${q.st==='cancelled'?'Cancelled, kept in history.':q.st==='done'?'Closed, confirmed at the door.':'Locked: the keeper has started picking. Edit and cancel are off.'}</span>`}</div></div>`}).join('')}
  </div>
  <div class="stub" style="margin-top:16px"><span class="lbl">Phone note</span><p style="margin:0;font-size:13.5px">Requests made on the phone while offline queue there and send once. This desktop view is for office and kitchen-office use.</p></div></aside></div>`;
}

/* ============ 4 ISSUES & LEDGER ============ */
const TYPES=['GRPO_RECEIPT','ISSUE_PENDING','ISSUE_PENDING_OFFSET','ISSUE_CONFIRMED','ISSUE_REVERSAL','COUNT_ADJUSTMENT','TRANSFER_OUT_INTRANSIT','TRANSFER_IN_RECEIVED'];
function vIssues(){
  const iss=S.issues.find(i=>i.id===S.isSel)||S.issues[0];
  const it=IT(iss.c);
  const rows=LED.filter(r=>r.ref===iss.id||r.ref.startsWith(iss.id));
  const stText=iss.st==='staged'?['Awaiting runner','re']:iss.acc===iss.q?['Confirmed','ok']:iss.acc===0?['Declined','er']:['Partial','am'];
  const rejected=iss.q-(iss.acc||0);
  const step=(n,t,ts,state)=>`<div class="${state}"><div class="dot"></div><div class="tt">${t}</div><div class="ts">${ts}</div></div>`;
  const done=iss.st==='done';
  const tl=`<div class="tl">${step(1,'Staged',iss.t[0]+' · keeper','done')}${step(2,'At door',done?iss.t[1]+' · runner':'waiting for runner',done?'done':'cur')}${step(3,done?(iss.acc===iss.q?'Confirmed':iss.acc===0?'Declined':'Partial'):'Outcome',done?(iss.acc===iss.q?'full qty accepted':iss.acc===0?'0 accepted, all back to shelf':fq(it,iss.acc)+' accepted · '+fq(it,rejected)+' back'):'pending',done?'done':'')}</div>`;
  const filt=LED.filter(r=>(S.ledF==='all'||r.t===S.ledF)&&(!S.ledQ||(IT(r.c).n+r.ref+r.id).toLowerCase().includes(S.ledQ.toLowerCase())));
  const issBox=tkS('ISSUE '+iss.id+' · '+iss.sec.toUpperCase(),'request '+iss.req,`
   <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="nm" style="font-family:var(--disp);font-size:22px;font-weight:600;text-transform:uppercase">${it.n}</span><span class="meta">${fq(it,iss.q)} issued · lot ${iss.lot}</span>${badge(...stText)}</div>${tl}
   <span class="lbl">Ledger rows for this issue</span>
   ${rows.map(r=>`<div class="ledrow"><span class="t">${r.t}</span><span class="meta">${r.dt.slice(7)} · ${r.who}</span><span class="${r.q<0?'neg':'pos'}">${sg(it,r.q)}</span></div>`).join('')}
   ${iss.st==='done'&&iss.acc!==iss.q&&iss.acc>0?`<p class="gloss" style="margin:8px 0 0">Partial accept: offset and confirmed rows equal the accepted ${fq(it,iss.acc)}. The ${fq(it,rejected)} not accepted returns to the shelf through ISSUE_REVERSAL.</p>`:''}
   ${iss.st==='staged'?`<div class="dash"></div><div class="note"><b>At the door.</b> The runner confirms on the phone. Demo only, simulate the runner:<div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost sm" data-a="run" data-v="all">Accept all</button><button class="btn ghost sm" data-a="run" data-v="half">Accept half</button><button class="btn ghost sm" data-a="run" data-v="none">Decline</button></div></div>`:''}`);
  const prim=`<button class="btn" data-a="export">Export ledger CSV</button>`;
  return head('Issue tracking · '+S.store,'Issues <em>&amp; ledger.</em>','Two-stage issue: staged by the keeper, confirmed at the door by the runner. The ledger below is append-only.',prim)+
  `<div class="cols c-is"><aside><span class="lbl" style="display:block;margin-bottom:8px">Recent issues</span><div class="list">${[...S.issues].reverse().map(i=>{const t=IT(i.c),s=i.st==='staged'?['Awaiting runner','re']:i.acc===i.q?['Confirmed','ok']:i.acc===0?['Declined','er']:['Partial','am'];
    return `<button class="item ${i.id===iss.id?'sel':''}" data-a="issel" data-v="${i.id}"><div class="top"><span class="id">${i.id}</span><span style="margin-left:auto">${badge(...s)}</span></div><div style="margin-top:4px"><b>${t.n}</b> ${fq(t,i.q)}</div><div class="meta">${i.sec} · staged ${i.t[0]}</div></button>`}).join('')}</div></aside>
   <div class="stack">${issBox}
   ${tkS('LEDGER · '+S.store+' · IMMUTABLE','append-only',`
    <div class="note" style="margin-bottom:12px">Rows cannot be edited or deleted. A mistake is corrected by a new row that references the old one.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:10px;flex-wrap:wrap">${chipRow([['all','All',LED.length],...TYPES.map(t=>[t,t.replace('ISSUE_','').replace('_',' '),LED.filter(r=>r.t===t).length])],S.ledF,'ledf')}
     <label class="sr" for="lq">Search ledger</label><input id="lq" class="in" style="width:220px;margin:0;margin-left:auto" data-i="ledq" value="${esc(S.ledQ)}" placeholder="Search item or reference"></div>
    <table class="dense"><thead><tr><th>Ledger ID</th><th>Time</th><th>Movement type</th><th>Item · lot</th><th class="num">Qty</th><th class="num">Stock after</th><th>Reference</th><th>Logged by</th></tr></thead><tbody>
    ${[...filt].reverse().slice(0,40).map(r=>{const t=IT(r.c);return `<tr class="${r.fresh?'sel':''}"><td class="m">${r.id}</td><td class="m">${r.dt.replace('02 Nov ','')}</td><td class="m" style="color:var(--navy)"><b>${r.t}</b></td><td>${t.n}<div class="meta" style="font-size:12px">${r.lot||'no lot'}</div></td><td class="num ${r.q<0?'neg':'pos'}"><b>${sg(t,r.q)}</b></td><td class="num">${r.after==null?'—':fq(t,r.after)}</td><td class="m">${r.ref}</td><td style="font-size:13px">${r.who.replace('Warehouse Keeper','Keeper').replace('Financial Controller','Fin. Controller').replace('Kitchen Runner','Runner')}</td></tr>`}).join('')||'<tr><td colspan="9"><div class="note">No ledger rows match.</div></td></tr>'}
    </tbody></table>`)}</div></div>`;
}

/* ============ 5 DAILY BALANCE ============ */
function balCalc(b){const exp=Math.round((b.o+b.r-b.i)*100)/100;const diff=Math.round((b.cnt-exp)*100)/100;const rc=S.rec[b.c];
  let st='ok';if(diff!==0){st='var';if(rc!==undefined&&rc!==''){if(Math.round((rc-exp)*100)/100===0)st='fixed';else if(S.cause[b.c]&&S.cause[b.c]!==CAUSES[0])st='esc'}}
  return {exp,diff,st}}
function vBalance(){
  const canCount=CAN_ISSUE_ROLES[S.role];
  const calc=S.bal.map(b=>({b,...balCalc(b)}));
  const open=calc.filter(x=>x.st==='var').length;
  const esc_=calc.filter(x=>x.st==='esc');
  const allOk=open===0;
  const prim=canCount?`<button class="btn" data-a="sign" ${allOk&&!S.signed?'':'disabled'}>${S.signed?'Signed off':'Sign off balance'}</button>`
    :`<button class="btn" data-a="ack" ${S.signed&&!S.ack?'':'disabled'}>${S.ack?'Acknowledged':'Acknowledge sign-off'}</button>`;
  const bmap={ok:badge('Balanced','ok'),var:badge('Variance · recount','er'),fixed:badge('Resolved by recount','ok'),esc:badge('Handled · escalated','am')};
  return head('Daily close · business day 01 Nov 2026 · '+S.store,'Daily <em>balance.</em>','Expected = Opening + Received − Issued. Counted is typed in by the custodian. Difference is calculated, never entered.',prim)+
  `<div class="cols c-bal"><div class="stack">${tkS('BALANCE SHEET · WH-DEL01-COLD','benchmark items (sample)',`
   <table><thead><tr><th>Item</th><th class="num">Opening</th><th class="num">Received</th><th class="num">Issued</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Diff</th><th>State</th></tr></thead><tbody>
   ${calc.map(({b,exp,diff,st})=>{const it=IT(b.c);const d=it.u==='kg'?1:0;return `<tr><td><b>${it.n}</b><div class="meta">${it.u}</div></td><td class="num">${b.o.toFixed(d)}</td><td class="num">${b.r.toFixed(d)}</td><td class="num">${b.i.toFixed(d)}</td><td class="num"><b>${exp.toFixed(d)}</b></td>
    <td class="num">${canCount&&!S.signed?`<input class="in num" style="width:84px;margin:0;display:inline-block" type="number" step="${it.u==='kg'?0.1:1}" id="cnt-${b.c}" data-i="cnt" data-k="${b.c}" value="${b.cnt}" aria-label="Counted ${it.n}">`:b.cnt.toFixed(d)}</td>
    <td class="num ${diff<0?'neg':diff>0?'pos':''}"><b>${diff===0?'0':(diff>0?'+':'−')+Math.abs(diff).toFixed(d)}</b></td><td>${bmap[st]}</td></tr>`}).join('')}</tbody></table>
   ${calc.filter(x=>x.st!=='ok').map(({b,exp,diff,st})=>{const it=IT(b.c);return `<div class="dash"></div><div><span class="lbl">${it.n}: difference ${sg(it,diff)}</span>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-top:6px"><div><label class="lbl" for="rc-${b.c}">Recount</label><input id="rc-${b.c}" class="in num" style="width:100px" type="number" step="0.1" data-i="rec" data-k="${b.c}" value="${S.rec[b.c]??''}" ${canCount&&!S.signed?'':'disabled'} placeholder="${it.u}"></div>
    <div><label class="lbl" for="ca-${b.c}">Cause (if still different)</label><select id="ca-${b.c}" class="in" style="width:240px" data-i="cause" data-k="${b.c}" ${canCount&&!S.signed?'':'disabled'}>${CAUSES.map(c=>`<option ${S.cause[b.c]===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div style="flex:1;min-width:200px"><label class="lbl" for="no-${b.c}">Note</label><input id="no-${b.c}" class="in" data-i="cnote" data-k="${b.c}" value="${esc(S.cnote[b.c]||'')}" ${canCount&&!S.signed?'':'disabled'} placeholder="What was checked"></div></div>
    ${st==='var'?`<p class="gloss" style="margin:6px 0 0">Recount first. If the recount matches expected, the variance clears. If not, choose a cause and it is escalated.</p>`:''}</div>`}).join('')}

  if(a.cat==='waste'&&S.role==='rm'&&a.by==='rm')return {ok:false,why:'Restaurant Manager cannot approve own claims.'};
  return {ok:true}}

 if(ok){C.rows.filter(r=>cState(r)==='diff').forEach(r=>{const l=IT(r.c).lots.find(x=>x.qty>0&&x.st!=='lk');append('COUNT_ADJUSTMENT',r.c,r2(r.rec-r.book),'ADJ-0'+C.vSeq,'Financial Controller',l?l.id:null)});cntClose('voucher')}
 else{C.st='voucher';C.cause='';C.note=''}}
function vCount(){
 const C=S.cnt,st=C.st,cnt=!!COUNTERS[S.role],R_=C.rows;
 const flagged=R_.filter(r=>cD(r)!==0),unres=flagged.filter(r=>cState(r)==='diff');
 const sub=st!=='count';
 const canRec=st==='recount'&&cnt&&S.role!==C.firstBy;
 const recAll=flagged.every(r=>r.rec!=null);
 let prim='';
 if(st==='count')prim=cnt?`<button class="btn" data-a="cfirst1">Submit first count</button>`:roNote('Counting is done by Warehouse Keeper, Custodian and Store Accountant.');
 else if(st==='recount')prim=canRec?`<button class="btn" data-a="crec1" ${recAll?'':'disabled'}>Submit recount</button>`:(cnt?`<div class="note am" style="max-width:420px"><b>Second person required.</b> The first count was submitted by ${ROLES[C.firstBy].l}. A different counter must recount. Use View as to switch.</div>`:roNote('Waiting for a second counter.'));
 else if(st==='sign')prim=cnt?`<button class="btn" data-a="csign">Sign count sheet as balanced</button>`:roNote('Counters sign the sheet.');
 else if(st==='voucher')prim=S.role==='acct'?`<button class="btn" data-a="cvoucher" ${C.cause&&C.cause!==CAUSES[0]?'':'disabled'}>Submit adjustment voucher</button>`:`<div class="note am" style="max-width:420px"><b>Root cause by Store Accountant.</b> ${cnt?'Counters recount but do not write the voucher.':'Waiting for the Store Accountant.'}</div>`;
 else if(st==='fc')prim=S.role==='fc'?`<span style="display:flex;gap:10px"><button class="btn" data-a="capprove">Approve voucher</button><button class="btn ghost" data-a="creject">Reject</button></span>`:`<div class="note" style="max-width:420px"><b>Waiting for Financial Controller.</b> ${cnt?'Counters cannot approve their own adjustment.':''}</div>`;
 else prim=cnt?`<button class="btn" data-a="cnew">Start new count</button>`:roNote('Count closed. Certificate archived.');
 const idx={count:0,recount:2,voucher:3,fc:4,sign:5,closed:6}[st];
 const skipV=(st==='sign'||(st==='closed'&&C.cert.kind==='sign'));
 const steps=[['Count','bins in order'],['Compare','app vs book'],['Recount','second person'],['Voucher','root cause'],['FC approval','Financial Controller'],['Certificate','archived']];
 const tl=`<div class="tl" style="grid-template-columns:repeat(6,1fr)">${steps.map(([t,s],i)=>`<div class="${i<idx?'done':i===idx?'cur':''}"><div class="dot"></div><div class="tt" style="font-size:15px">${t}</div><div class="ts">${(skipV&&(i===3||i===4))||(i===2&&!flagged.length&&sub)?'not needed':s}</div></div>`).join('')}</div>`;
 const bmap={ok:badge('Balanced','ok'),need:badge('Needs recount','er'),fixed:badge('Resolved by recount','ok'),diff:badge('Still differs','am')};
 const tbl=`<table><thead><tr><th>#</th><th>Bin</th><th>Item</th><th class="num">Book qty</th><th class="num">First count</th><th class="num">Diff</th><th class="num">Recount</th><th>State</th></tr></thead><tbody>
 ${R_.map((r,i)=>{const it=IT(r.c),d=cD(r);return `<tr><td class="m">${i+1}</td><td class="m" style="color:var(--navy)"><b>${r.bin}</b><div style="font-weight:400">${r.d}</div></td><td><b>${it.n}</b><div class="meta">${it.u}</div></td>
  <td class="num">${st==='count'?'<span class="gloss">hidden</span>':fq(it,r.book)}</td>
  <td class="num">${st==='count'&&cnt?`<input id="cf-${r.bin}" class="in num" style="width:92px;margin:0;display:inline-block" type="number" step="${it.u==='kg'?0.1:1}" data-i="cfirst" data-k="${r.bin}" value="${r.first}" aria-label="First count ${it.n}">`:fq(it,r.first)}</td>
  <td class="num ${d<0?'neg':d>0?'pos':''}"><b>${st==='count'?'—':dq(it,d)}</b></td>
  <td class="num">${st==='count'||cD(r)===0?'—':canRec?`<input id="cr-${r.bin}" class="in num" style="width:92px;margin:0;display:inline-block" type="number" step="${it.u==='kg'?0.1:1}" data-i="crec" data-k="${r.bin}" value="${r.rec==null?'':r.rec}" placeholder="${it.u}" aria-label="Recount ${it.n}">`:(r.rec==null?'waiting':fq(it,r.rec))}</td>
  <td>${st==='count'?badge('Not compared','mu'):bmap[cState(r)]}</td></tr>`}).join('')}</tbody></table>
  <p class="gloss" style="margin:10px 0 0">Bins are listed in spatial order, top to bottom and right to left. Book quantity is hidden during the first count.</p>`;
 const vShow=(st==='voucher'||st==='fc'||(st==='closed'&&C.hadV));
 const vch=vShow?`<div class="dash"></div><span class="lbl">Adjustment voucher ADJ-0${C.vSeq} · ${st==='fc'?'submitted':st==='closed'?'approved':'draft'}</span>
  <table style="margin-top:8px"><thead><tr><th>Item</th><th class="num">Book</th><th class="num">Recount</th><th class="num">Adjustment</th></tr></thead><tbody>${unres.map(r=>{const it=IT(r.c);return `<tr><td>${it.n}</td><td class="num">${fq(it,r.book)}</td><td class="num">${fq(it,r.rec)}</td><td class="num neg"><b>${sg(it,r2(r.rec-r.book))}</b></td></tr>`}).join('')}</tbody></table>
  <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap"><div><label class="lbl" for="cause">Root cause (Store Accountant)</label><select id="cause" class="in" style="width:260px" data-i="ccause" ${st==='voucher'&&S.role==='acct'?'':'disabled'}>${CAUSES.map(c=>`<option ${C.cause===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div style="flex:1;min-width:220px"><label class="lbl" for="cnote">Note</label><input id="cnote" class="in" data-i="cnote2" value="${esc(C.note)}" ${st==='voucher'&&S.role==='acct'?'':'disabled'} placeholder="What was checked, who recounted"></div></div>`:'';
 const body=tl+tbl+vch;
 const typeSeg=`<div class="seg" role="group" aria-label="Count type">${[['WEEKLY','WEEKLY_CYCLE'],['MONTH','MONTH_END_FULL']].map(([v,l])=>`<button class="${C.type===v?'on':''}" data-a="ctype" data-v="${v}" ${st==='count'&&cnt?'':'disabled'}>${l}</button>`).join('')}</div>`;
 const closedV=st==='closed'&&C.cert.kind==='voucher';
 const adjRows=unres.map(r=>{const it=IT(r.c);return `<div class="ledrow"><span class="t">COUNT_ADJUSTMENT</span><span>${it.n}</span><span class="neg">${sg(it,r2(r.rec-r.book))}</span></div><div class="meta" style="margin:-2px 0 6px">stock ${fq(it,closedV?r.rec:r.book)}${closedV?'':' → <b>'+fq(it,r.rec)+'</b>'}</div>`}).join('');
 const right=`<aside class="stack">
  <div class="stub w"><span class="lbl">Sheet</span><table class="tick"><tr><td>Type</td><td>${C.type==='MONTH'?'MONTH_END_FULL':'WEEKLY_CYCLE'}</td></tr><tr><td>Room</td><td>WH-DEL01-COLD</td></tr><tr><td>Status</td><td>${frozen()?'FROZEN_FOR_COUNT':'ACTIVE'}</td></tr><tr><td>First count</td><td>${C.firstBy?ROLES[C.firstBy].l:'—'}</td></tr><tr><td>Recount</td><td>${C.recBy?ROLES[C.recBy].l:'—'}</td></tr><tr><td>Bins</td><td>${R_.length} · ${flagged.length} flagged</td></tr></table></div>
  <div class="stub w"><span class="lbl">${closedV?'Ledger rows appended':'Ledger rows on approval'}</span>${unres.length&&sub&&st!=='recount'?adjRows:`<p class="gloss" style="margin:0">${st==='closed'?'No adjustment needed. Nothing appended.':'Appended only after Financial Controller approval, one row per line that still differs after recount.'}</p>`}</div>
  ${st==='closed'?`<div class="note ok"><b>Certificate ${C.cert.id} archived at ${C.cert.at}.</b> Freeze lifted. Counters: ${C.firstBy?ROLES[C.firstBy].l:''}${C.recBy?' and '+ROLES[C.recBy].l:''}.${closedV?' Approved by Financial Controller.':''}</div>`:''}
  <div class="stub"><span class="lbl">Segregation of duties</span><p style="margin:0;font-size:13.5px">Whoever counts cannot approve a book adjustment. The recount must be done by a second person. Only the Financial Controller approves the voucher.</p></div></aside>`;
 return head('Count and reconciliation · '+S.store,'Stock <em>count.</em>','First count, app compares with book, second-person recount, root cause on a voucher, Financial Controller approval, then the certificate is archived.',`<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">${typeSeg}${prim}</div>`)+freezeBar()+
  `<div class="cols c-bal"><div>${tkS('COUNT SHEET · WH-DEL01-COLD',C.type==='MONTH'?'month-end full inventory':'weekly cycle count',body)}</div>${right}</div>`;
}

/* ============ 10 TRANSFERS & WASTE (Flow G) ============ */
const TST={draft:['Draft','mu'],transit:['In transit','re'],received:['Received','ok'],variance:['Variance · with FC','am'],held:['Closed · shrinkage held','er']};
const rxOf=t=>S.trf.rx[t.id]||(S.trf.rx[t.id]={seal:false,kg:'',pcs:''});
const tOther=t=>t.dir==='out';
function trfDecision(a,ok){const t=S.trf.list.find(x=>x.id===a.tid),o=tOther(t);
 append('TRANSFER_IN_RECEIVED',t.c,t.rk,t.id+(o?' @'+t.to:''),ok?'Financial Controller':'Receiving Keeper',null,o);
 if(ok)append('TRANSFER_VARIANCE_ADJ',t.c,r2(-(t.kg-t.rk)),t.id+' (approved)','Financial Controller',null,true);
 else append('TRANSFER_SHRINKAGE_HELD',t.c,0,t.id+' held '+fq(IT(t.c),t.kg-t.rk)+' / '+(t.pcs-t.rp)+' pcs','Financial Controller',null,true);
 t.st=ok?'received':'held'}
function vTransfers(){
 const T=S.trf,tab=T.tab;
 const tabs=`<div class="seg" role="tablist"><button class="${tab==='trf'?'on':''}" data-a="ttab" data-v="trf">Inter-store transfers</button><button class="${tab==='waste'?'on':''}" data-a="ttab" data-v="waste">Waste and supplier returns</button></div>`;
 const keep=(S.role==='keeper'||S.role==='cust');
 return head('Other movements · '+S.store,'Transfers <em>&amp; waste.</em>','Two units on every transfer (kg and pcs). The receiving side counts both. A mismatch goes to the Financial Controller, never to the dispatching keeper.',tabs)+freezeBar()+(tab==='trf'?vTrf(keep):vWaste());
}
function vTrf(keep){
 const T=S.trf,isNew=T.sel==='NEW'&&keep;const t=T.list.find(x=>x.id===T.sel)||T.list[0];
 const left=`<aside><div class="list">${keep?`<button class="item ${isNew?'sel':''}" data-a="tsel" data-v="NEW"><div class="top"><span class="id">New dispatch</span>${badge('Draft','mu')}</div><div class="meta" style="margin-top:4px">${S.store} to another store</div></button>`:''}
  ${T.list.map(x=>{const it=IT(x.c);return `<button class="item ${!isNew&&x.id===t.id?'sel':''}" data-a="tsel" data-v="${x.id}"><div class="top"><span class="id">${x.id}</span>${badge(x.dir==='out'?'OUT':'IN','mu')}<span style="margin-left:auto">${badge(...TST[x.st])}</span></div><div style="margin-top:4px"><b>${it.n}</b> · ${x.kg.toFixed(1)} kg / ${x.pcs} pcs</div><div class="meta">${x.from} to ${x.to}</div></button>`}).join('')}</div></aside>`;
 let mid,right;
 if(isNew){const d=T.nd,it=IT(d.c);const ok=d.kg>0&&d.pcs>0&&d.seal.trim().length>2&&!frozen();
  mid=tkS('NEW TRANSFER · DISPATCH','Dispatching keeper, '+S.store,`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
   <div><label class="lbl" for="nd-c">Item</label><select id="nd-c" class="in" data-i="ndc">${['RM-MOZ-01','RM-RIC-01','RM-CHK-01','RM-PAR-01'].map(c=>`<option value="${c}" ${c===d.c?'selected':''}>${IT(c).n}</option>`).join('')}</select></div>
   <div><label class="lbl" for="nd-to">To store</label><select id="nd-to" class="in" data-i="ndto">${['IND-DEL-02','IND-BLR-01'].map(c=>`<option ${c===d.to?'selected':''}>${c}</option>`).join('')}</select></div>
   <div><label class="lbl" for="nd-kg">Weight, kg (signed)</label><input id="nd-kg" class="in num" type="number" step="0.1" data-i="ndkg" value="${d.kg}"></div>
   <div><label class="lbl" for="nd-pcs">Pieces, pcs (signed)</label><input id="nd-pcs" class="in num" type="number" step="1" data-i="ndpcs" value="${d.pcs}"></div>
   <div style="grid-column:span 2"><label class="lbl" for="nd-seal">Vehicle seal no.</label><input id="nd-seal" class="in" data-i="ndseal" value="${esc(d.seal)}" placeholder="e.g. SL-884130"></div></div>
   <p class="gloss">Both units are required: weight and pieces together remove cutting-shrinkage disputes.</p><div class="dash"></div>
   <div style="display:flex;align-items:center;gap:16px"><span class="meta" style="flex:1">Book stock leaves ${S.store} at once and sits in transit. ${frozen()?'Blocked: system freeze.':''}</span><button class="btn" data-a="tdispatch" ${ok?'':'disabled'}>Sign both units &amp; dispatch</button></div>`);
  right=`<aside class="stack"><div class="stub w"><span class="lbl">Ledger rows this will append</span><div class="ledrow"><span class="t">TRANSFER_OUT_INTRANSIT</span><span>${it.n}</span><span class="neg">${sg(it,-d.kg)}</span></div><p class="gloss" style="margin:8px 0 0">Reference: ${d.pcs} pcs, seal ${esc(d.seal)||'—'}. Status becomes IN_TRANSIT.</p></div>
   <div class="stub"><span class="lbl">Live derived stock</span><table class="tick"><tr><td style="width:auto">${it.n}</td><td>${fq(it,it.book)} → <b>${fq(it,r2(it.book-d.kg))}</b></td></tr></table></div></aside>`;
 }else{
  const it=IT(t.c),rx=rxOf(t);
  const canRx=t.dir==='in'&&t.st==='transit'&&keep;
  const rk=rx.kg===''?null:+rx.kg,rp=rx.pcs===''?null:+rx.pcs;
  const match=rk!==null&&rp!==null&&rk===t.kg&&rp===t.pcs&&rx.seal;
  const step=(tt,ts,s)=>`<div class="${s}"><div class="dot"></div><div class="tt">${tt}</div><div class="ts">${ts}</div></div>`;
  const tl=`<div class="tl">${step('Dispatched','both units + seal, '+t.t,'done')}${step('In transit','TRANSFER_OUT_INTRANSIT',t.st==='transit'?'cur':'done')}${step(t.st==='variance'?'Variance':t.st==='held'?'Closed, held':'Received',t.st==='transit'?'receiving keeper counts':t.st==='variance'?'with Financial Controller':'signed',t.st==='transit'?'':(t.st==='variance'?'cur':'done'))}</div>`;
  let noteBlock;
  if(t.st==='transit'){
   noteBlock=canRx?`<div class="dash"></div><span class="lbl">Receiving count at ${t.to} (both units)</span>
   <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:6px"><label style="display:flex;gap:8px;align-items:center;padding-bottom:10px"><input type="checkbox" id="rxs" data-i="rxseal" ${rx.seal?'checked':''}> Seal ${t.seal} intact and matches</label>
   <div><label class="lbl" for="rx-kg">Counted kg</label><input id="rx-kg" class="in num" style="width:100px" type="number" step="0.1" data-i="rxkg" value="${rx.kg}"></div>
   <div><label class="lbl" for="rx-pcs">Counted pcs</label><input id="rx-pcs" class="in num" style="width:100px" type="number" step="1" data-i="rxpcs" value="${rx.pcs}"></div></div>
   <div class="note ${rk===null||rp===null?'':match?'ok':'er'}" style="margin-top:10px">${rk===null||rp===null?'Enter both counts to compare against the dispatch note.':match?'Matches the dispatch note in both units and the seal is intact. Receipt can be signed.':`<b>Mismatch.</b> kg ${dq(it,r2(rk-t.kg))}, pcs ${rp-t.pcs>0?'+':'−'}${Math.abs(rp-t.pcs)}${rx.seal?'':', seal not confirmed'}. This goes to the Financial Controller as a transit variance.`}</div>
   <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn" data-a="trecv" ${rk===null||rp===null?'disabled':''}>${match?'Sign receipt':'Send variance to Financial Controller'}</button></div>`
   :`<div class="dash"></div><div class="note">${t.dir==='out'?`<b>Waiting at ${t.to}.</b> The receiving keeper there verifies the seal and counts both units. Your scope ends at dispatch.`:`<b>Receiving is for Warehouse Keeper or Custodian.</b>`}</div>`;
  }else if(t.st==='variance'){
   const ap=S.aps.find(a=>a.tid===t.id);const c=ap?canApprove(ap):{ok:false,why:''};
   noteBlock=`<div class="dash"></div><div class="note am"><b>Transit variance.</b> Dispatched ${t.kg.toFixed(1)} kg / ${t.pcs} pcs, received ${t.rk.toFixed(1)} kg / ${t.rp} pcs. Short ${r2(t.kg-t.rk).toFixed(1)} kg / ${t.pcs-t.rp} pcs. Approve: book the voucher and close. Reject: book what was received, close transit, hold the difference as shrinkage.</div>
   <div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">${c.ok?`<button class="btn" data-a="tapprove" data-id="${ap.id}">Approve variance voucher</button><button class="btn ghost" data-a="treject" data-id="${ap.id}">Reject, hold shrinkage</button>`:`<button class="btn" disabled>Approve variance voucher</button><span class="gloss" style="color:var(--err)">${S.role==='fc'?c.why:'Only the Financial Controller approves. Neither the dispatching keeper nor the receiving keeper who counted can.'}</span>`}</div>`;
  }else noteBlock=`<div class="dash"></div><div class="note ${t.st==='received'?'ok':'er'}"><b>${t.st==='received'?'Closed. Received in full or by approved voucher.':'Closed. Received quantity booked, difference held as shrinkage.'}</b></div>`;
  mid=tkS(t.id+' · '+(t.dir==='out'?'OUT':'IN')+' · '+t.from+' to '+t.to,TST[t.st][0],`
   <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span style="font-family:var(--disp);font-size:24px;font-weight:600;text-transform:uppercase">${it.n}</span>${badge(...TST[t.st])}</div>${tl}
   <table><thead><tr><th></th><th class="num">kg</th><th class="num">pcs</th><th>Seal</th></tr></thead><tbody><tr><td>Dispatch note</td><td class="num"><b>${t.kg.toFixed(1)}</b></td><td class="num"><b>${t.pcs}</b></td><td class="m">${t.seal}</td></tr>
   ${t.rk!=null?`<tr><td>Received count</td><td class="num"><b>${t.rk.toFixed(1)}</b></td><td class="num"><b>${t.rp}</b></td><td class="m">${t.sealOk?'intact':'not confirmed'}</td></tr>`:''}</tbody></table>${noteBlock}`);
  const done=LED.filter(r=>r.ref.startsWith(t.id));
  const plan=t.st==='transit'&&t.dir==='in'?(match?[['TRANSFER_IN_RECEIVED',r2(rk),false]]:[]):t.st==='variance'?[['TRANSFER_IN_RECEIVED',t.rk,t.dir==='out'],['TRANSFER_VARIANCE_ADJ',r2(-(t.kg-t.rk)),true]]:[];
  right=`<aside class="stack"><div class="stub w"><span class="lbl">Ledger rows so far</span>${done.map(r=>`<div class="ledrow"><span class="t">${r.t}</span><span class="meta">${r.dt.replace('02 Nov ','')}</span><span class="${r.q<0?'neg':'pos'}">${sg(it,r.q)}</span></div>`).join('')||'<p class="gloss" style="margin:0">None yet.</p>'}</div>
   <div class="stub w"><span class="lbl">${t.st==='variance'?'Rows if approved':'Row on next step'}</span>${plan.length?plan.map(p=>`<div class="ledrow"><span class="t">${p[0]}</span><span class="meta">${p[2]?'other store':'this store'}</span><span class="${p[1]<0?'neg':'pos'}">${sg(it,p[1])}</span></div>`).join(''):`<p class="gloss" style="margin:0">${t.st==='transit'&&t.dir==='in'?'On a mismatch nothing is booked until the Financial Controller decides.':'Nothing further.'}</p>`}
   ${t.st==='variance'?`<p class="gloss" style="margin:8px 0 0">If rejected: TRANSFER_IN_RECEIVED ${sg(it,t.rk)} and TRANSFER_SHRINKAGE_HELD for the difference (no stock effect).</p>`:''}</div>
   <div class="stub"><span class="lbl">Rules</span><p style="margin:0;font-size:13.5px">Both units signed at dispatch. The receiver verifies the seal first. The dispatching keeper cannot approve a transit variance.</p></div></aside>`;
 }
 return `<div class="cols c-rq">${left}<div>${mid}</div>${right}</div>`;
}
const REASONS=['Select reason','EXPIRED','SPOILAGE','DAMAGED','PREP_LOSS','SUPPLIER_FAIL_QC'];
function vWaste(){
 const W=S.wf,log=['keeper','req','cust'].includes(S.role),claims=S.aps.filter(a=>a.cat==='waste'&&(S.role==='fc'||S.role==='rm'||log||true));
 const isNew=S.wasteNew&&log;const a=isNew?null:(claims.find(x=>x.id===S.apSel)||claims[0]);
 const left=`<aside><div class="list">${log?`<button class="item ${isNew?'sel':''}" data-a="wnew"><div class="top"><span class="id">Log a claim</span>${badge('New','mu')}</div><div class="meta" style="margin-top:4px">waste or supplier return</div></button>`:''}
  ${claims.map(x=>{const sl={open:['Open','mu'],ok:['Approved','ok'],no:['Rejected','er']}[x.st],it=IT(x.item);return `<button class="item ${!isNew&&a&&x.id===a.id?'sel':''}" data-a="wsel" data-v="${x.id}"><div class="top"><span class="id">${x.id}</span>${badge(x.sz==='minor'?'Minor':'Major','mu')}<span style="margin-left:auto">${badge(...sl)}</span></div><div style="margin-top:4px"><b>${x.title}</b></div><div class="meta">${it.n} ${sg(it,x.q)} · logged by ${ROLES[x.by].l}</div></button>`}).join('')}</div></aside>`;
 let mid;
 if(isNew){const it=IT(W.c);const ok=W.q>0&&W.reason&&W.reason!==REASONS[0]&&W.photo&&(W.type==='waste'||W.ref.trim());
  mid=tkS('LOG CLAIM · '+(W.type==='waste'?'WASTE':'SUPPLIER RETURN'),'logged by '+R().l,`<div class="seg" style="margin-bottom:12px">${[['waste','Waste'],['return','Supplier return']].map(([v,l])=>`<button class="${W.type===v?'on':''}" data-a="wtype" data-v="${v}">${l}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label class="lbl" for="w-c">Item</label><select id="w-c" class="in" data-i="wc">${ITEMS.filter(i=>i.wh==='COLD').map(i=>`<option value="${i.c}" ${i.c===W.c?'selected':''}>${i.n}</option>`).join('')}</select></div>

  ${W.type==='return'?`<div><label class="lbl" for="w-ref">PO or GRPO matched</label><input id="w-ref" class="in" data-i="wref" value="${esc(W.ref)}" placeholder="e.g. GRPO 5104398"></div>`:'<div></div>'}</div>

  <div class="dash"></div><div style="display:flex;align-items:center;gap:16px"><span class="meta" style="flex:1">Quantity ${W.q>2?'is above':'is within'} the sample minor limit of 2.0. ${W.q>2?'Financial Controller':'Restaurant Manager'} approves. You cannot approve your own claim.</span><button class="btn" data-a="wsubmit" ${ok?'':'disabled'}>Submit claim</button></div>`);
 }else if(a){const it=IT(a.item),c=canApprove(a);
  mid=tkS(a.id+' · '+a.title.toUpperCase(),a.st==='open'?'awaiting approver':a.st==='ok'?'approved':'rejected',`<table class="tick"><tr><td>Item</td><td>${it.n}</td></tr><tr><td>Quantity</td><td>${sg(it,a.q)}</td></tr><tr><td>Reference</td><td>${a.ref}</td></tr><tr><td>Logged by</td><td>${ROLES[a.by].l}</td></tr><tr><td>Evidence</td><td>photo attached (placeholder)</td></tr><tr><td>Size</td><td>${a.sz==='minor'?'Minor (sample): Restaurant Manager':'Major: Financial Controller'}</td></tr></table><p style="margin:12px 0 0">${a.note}</p><div class="dash"></div>
  ${a.st!=='open'?`<div class="note ${a.st==='ok'?'ok':'er'}"><b>${a.st==='ok'?'Approved. Ledger row appended.':'Rejected. No stock change.'}</b></div>`:c.ok?`<div style="display:flex;gap:12px"><button class="btn" data-a="approve">Approve claim</button><button class="btn ghost" data-a="reject">Reject</button></div>`:`<div class="note er"><b>Cannot approve.</b> ${c.why}</div>`}`);
 }else mid='<div class="note">No claims.</div>';
 const right=`<aside class="stack"><div class="stub w"><span class="lbl">Who does what</span><p style="margin:0;font-size:13.5px">Keeper, section staff and custodian log claims. Restaurant Manager approves minor claims below the threshold [Owner to set]. Financial Controller approves major claims. Logger and approver are never the same.</p></div>
  <div class="stub"><span class="lbl">Evidence and reason</span><p style="margin:0;font-size:13.5px">Every waste claim needs a reason code and a photo. A supplier return needs the matched PO or GRPO and a driver signature on the return document.</p></div></aside>`;
 return `<div class="cols c-rq">${left}<div>${mid}</div>${right}</div>`;
}
